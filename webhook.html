  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS S3 Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #232F3E, #FF9900);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        h1 {
            color: #232F3E;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin: 10px 0;
            line-height: 1.6;
        }

        .success {
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #FF9900;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e68a00;
        }

        footer {
            margin-top: 25px;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🚀 Welcome to Amazon S3</h1>

    <p>Your static website is successfully hosted on <strong>Amazon S3</strong>.</p>

    <p>This page is being served directly from an S3 bucket.</p>

    <p class="success">✅ Deployment Successful!</p>

    <a href="https://aws.amazon.com/s3/" class="btn" target="_blank">
        Learn More About S3
    </a>

    <footer>
        Hosted using Amazon S3 Static Website Hosting
    </footer>
</div>

</body>
</html>
